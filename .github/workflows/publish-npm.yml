name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      alpha_snapshot:
        description: 'Stamp a unique alpha version (0.1.0-alpha.<run_number>) if running manually from main'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm for OIDC Trusted Publishing (requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build production bundle & types
        run: npm run build

      - name: Verify core and framework subpath export artifacts
        run: |
          for f in \
            dist/webdb.js \
            dist/webdb.umd.cjs \
            dist/index.d.ts \
            dist/react.js \
            dist/react.cjs \
            dist/react.d.ts \
            dist/angular.js \
            dist/angular.cjs \
            dist/angular.d.ts \
            dist/vue.js \
            dist/vue.cjs \
            dist/vue.d.ts; do
            if [ ! -s "$f" ]; then
              echo "Error: Missing or empty build artifact: $f"
              exit 1
            fi
          done
          echo "All core and subpath export artifacts verified."

      - name: Install Playwright Chromium for E2E tests
        run: npx playwright install --with-deps chromium

      - name: Run real-browser ACID & crash recovery E2E tests
        run: npm run test:e2e

      - name: Determine version and npm dist-tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.alpha_snapshot }}" = "true" ]; then
            BASE_VER=$(node -p "require('./package.json').version.split('-')[0]")
            NEW_VER="${BASE_VER}-alpha.${{ github.run_number }}"
            npm version "$NEW_VER" --no-git-tag-version
          fi

          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

          if [[ "$PKG_VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$PKG_VERSION" == *"-beta"* ]] || [[ "$PKG_VERSION" == *"-rc"* ]]; then
            echo "tag=next" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish package to npm (via OIDC Trusted Publishing)
        run: npm publish --tag ${{ steps.meta.outputs.tag }} --access public --provenance

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease' || '' }}

