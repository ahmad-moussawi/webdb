    <script>
      // Suppress harmless Monaco internal worker race condition on inmemory models
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && String(event.reason.message || event.reason).includes('inmemory://model')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        if (event.message && String(event.message).includes('inmemory://model')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
