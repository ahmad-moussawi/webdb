# git-cliff configuration for automated GitHub Release notes
# https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
{% if version %}\
## What's Changed in {{ version }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ahmad-moussawi/webdb/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
{% if previous.version %}\
**Full Changelog:** https://github.com/ahmad-moussawi/webdb/compare/{{ previous.version }}...{{ version }}
{% endif %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/ahmad-moussawi/webdb/issues/${2}))" },
]
commit_parsers = [
  { message = "^[0-9]+\\.[0-9]+\\.[0-9]+", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^docs", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Tests" },
  { message = "^(ci|build|chore)", group = "⚙️ CI & Maintenance" },
  { body = ".*", group = "📦 Other Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
